; =============================================================================
; pytest.ini — configuração do RefCap (src/)
;
; ⚠️ REGRA DE OURO DESTE ARQUIVO
;    NUNCA use comentário na MESMA LINHA de um valor.
;    O parser de .ini do Python não reconhece comentário inline: ele mantém o
;    "#" como parte do valor. Em `addopts`, isso vira um argumento de linha de
;    comando e o pytest aborta com:
;        ERROR: file or directory not found: #
;
;    ERRADO:  addopts = -ra   # roda tudo
;    CERTO:   # roda tudo
;             addopts = -ra
;
;    Use ";" ou "#" apenas no INÍCIO da linha, como neste cabeçalho.
; =============================================================================

[pytest]

; -----------------------------------------------------------------------------
; Onde procurar testes quando você roda `pytest` sem argumentos.
; Precisa bater com o NOME REAL da pasta (aqui: "test", singular).
; -----------------------------------------------------------------------------
testpaths = test

; -----------------------------------------------------------------------------
; Pastas que o pytest nunca percorre.
; O "scratch" fica livre para experimentos — nada lá é coletado.
; (.venv, .git e afins já são ignorados por padrão: o default inclui ".*")
; -----------------------------------------------------------------------------
norecursedirs =
    scratch
    .venv
    __pycache__
    *.egg-info

; -----------------------------------------------------------------------------
; Marcadores. Com --strict-markers, usar um marcador não declarado aqui vira
; erro — o que evita typos silenciosos (ex.: @pytest.mark.slwo).
; -----------------------------------------------------------------------------
markers =
    slow: testes lentos, com modelos reais; desligados por padrão
    gpu: exige GPU disponível
    e2e: pipeline ponta a ponta
    integration: integra componentes reais, sem stubs

; -----------------------------------------------------------------------------
; Opções aplicadas sempre.
;   -ra                 resumo de tudo que não passou
;   --strict-markers    marcador não declarado = erro
;   --strict-config     erro de digitação NESTE arquivo = erro (não silêncio)
;   -m "..."            o loop rápido roda só o que não é lento/gpu/e2e
;
; As ASPAS funcionam aqui (o pytest usa shlex). O que não funciona é comentário
; na mesma linha — ver a REGRA DE OURO no topo.
; -----------------------------------------------------------------------------
addopts =
    -ra
    --strict-markers
    --strict-config
    -m "not slow and not gpu and not e2e"

; -----------------------------------------------------------------------------
; Avisos silenciados.
; -----------------------------------------------------------------------------
filterwarnings =
    ignore::DeprecationWarning
