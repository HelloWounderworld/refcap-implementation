; =============================================================================
; supervisord — RefCap API
;
; ⚠️ REGRA DE OURO (a mesma do pytest.ini)
;    NUNCA use comentário na MESMA LINHA de um valor. O parser de .ini do
;    Python mantém o "#" como parte do valor. Comentários só em linha própria,
;    começando com ";" ou "#".
;
;    ERRADO:  numprocs=1   ; um worker
;    CERTO:   ; um worker
;             numprocs=1
; =============================================================================
[supervisord]
nodaemon=true

[program:refcap-api]

; -----------------------------------------------------------------------------
; UM worker, deliberadamente.
;
; Cada worker adicional carrega SEU PRÓPRIO conjunto de modelos na GPU — dois
; workers com BLIP-large são dois BLIP-large residentes. E inferência simultânea
; no mesmo modelo não traz ganho real, porque a GPU já serializa internamente.
;
; A serialização das requisições é feita dentro da aplicação (asyncio.Lock em
; jobs.py), não pelo supervisord.
;
; Se um dia rodar em CPU, aí sim múltiplos workers fazem sentido.
; -----------------------------------------------------------------------------
# numprocs=1

command=uvicorn app:app --host 0.0.0.0 --port 8000 --workers 1
directory=/teramatsu/api/

; -----------------------------------------------------------------------------
; O ambiente do processo.
;
; ★ CUDA_VISIBLE_DEVICES definido AQUI é respeitado pelo RefCap, porque o
;   construct.py foi ajustado para usar os.environ.setdefault() em vez de
;   atribuição direta. Antes desse ajuste, importar o construct.py forçava a
;   GPU 0 independentemente do que estivesse configurado.
;
; ★ REFCAP_ROOT é opcional: sem ele, a API assume <pai-do-api>/src.
; -----------------------------------------------------------------------------
environment=
    CUDA_VISIBLE_DEVICES="0",
    TOKENIZERS_PARALLELISM="false",
    REFCAP_ROOT="/caminho/para/projeto/src",
    REFCAP_DEVICE="cuda",
    REFCAP_CAPTION_MODEL="Salesforce/blip-image-captioning-large",
    REFCAP_BLIP_ITM_MODEL="Salesforce/blip-itm-base-coco",
    REFCAP_SENTENCE_TRANSFORMER="paraphrase-distilroberta-v2",
    REFCAP_CARREGAR_MODELOS="1",
    LOG_LEVEL="INFO"

; -----------------------------------------------------------------------------
; Ciclo de vida.
;
; startsecs alto: o processo só é considerado "rodando" depois que os modelos
; carregaram. Ajuste conforme o tempo real de carga na sua máquina — se for
; baixo demais, o supervisord acha que o serviço falhou e fica reiniciando.
;
; stopwaitsecs alto: dá tempo de um job em andamento terminar antes do SIGKILL.
; -----------------------------------------------------------------------------
autostart=true
autorestart=true
startsecs=60
startretries=3
stopwaitsecs=120
stopsignal=TERM

; -----------------------------------------------------------------------------
; Logs.
; -----------------------------------------------------------------------------
stdout_logfile=/var/log/refcap-api/stdout.log
stderr_logfile=/var/log/refcap-api/stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5

# user=seu_usuario
