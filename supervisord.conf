; =============================================================================
; supervisord — RefCap API
;
; NOTA SOBRE COMENTÁRIOS  (correção de uma afirmação anterior minha)
;    Diferente do pytest.ini, o supervisord REMOVE comentários inline
;    corretamente — verifiquei: `command=... --port 8000  # comentario` chega
;    ao processo como ['--port','8000'], sem o comentário.
;    Ainda assim, comentário em linha própria é mais legível. Use ";".
; =============================================================================

[supervisord]
nodaemon=true

[program:refcap-api]

; -----------------------------------------------------------------------------
; UM worker, deliberadamente.
;
; Cada worker adicional carrega SEU PRÓPRIO conjunto de modelos na GPU — dois
; workers com BLIP-large são dois BLIP-large residentes. E inferência simultânea
; no mesmo modelo não traz ganho real, porque a GPU já serializa internamente.
;
; A serialização das requisições é feita dentro da aplicação (asyncio.Lock em
; jobs.py), não pelo supervisord.
;
; Se um dia rodar em CPU, aí sim múltiplos workers fazem sentido.
; -----------------------------------------------------------------------------
; ⚠️ NUNCA use --reload no uvicorn aqui: ele recria o processo a cada mudança
;    de arquivo, recarregando os modelos junto e anulando o estado permanente.
numprocs=1

; ★ O CAMINHO ABSOLUTO DO VENV É OBRIGATÓRIO
;   O supervisord herda o ambiente de QUEM O INICIOU — normalmente o init do
;   sistema, não o seu shell. Verifiquei num teste real: dentro do processo
;   filho, VIRTUAL_ENV fica AUSENTE e sys.executable é o python do SISTEMA.
;   Por isso NÃO use `command=uvicorn ...` — aponte para o binário do venv.
;
; O `directory` deve apontar para a pasta que contém o app.py.
;   arranjo (A) api/ ao lado :  /caminho/para/projeto/api
;   arranjo (B) api/ dentro  :  /caminho/para/projeto/src/api
command=/caminho/para/.venv/bin/uvicorn app:app --host 0.0.0.0 --port 8000 --workers 1
directory=/caminho/para/projeto/api

; -----------------------------------------------------------------------------
; O ambiente do processo.
;
; ★ CUDA_VISIBLE_DEVICES definido AQUI é respeitado pelo RefCap, porque o
;   construct.py foi ajustado para usar os.environ.setdefault() em vez de
;   atribuição direta. Antes desse ajuste, importar o construct.py forçava a
;   GPU 0 independentemente do que estivesse configurado.
;
; ★ REFCAP_ROOT é OPCIONAL. Sem ele, a API descobre a raiz pelo marcador
;   `pipeline/propgenerator/base.py`, cobrindo os dois arranjos (api/ ao lado
;   ou api/ dentro do RefCap). Defina-o se a pasta do RefCap tiver um nome
;   fora do usual (src, RefCap, refcap).
; -----------------------------------------------------------------------------
environment=
    CUDA_VISIBLE_DEVICES="0",
    TOKENIZERS_PARALLELISM="false",
    REFCAP_ROOT="/caminho/para/projeto/src",
    REFCAP_DEVICE="cuda",
    REFCAP_CAPTION_MODEL="/caminho/local/blip-image-captioning-large",
    REFCAP_BLIP_ITM_MODEL="/caminho/local/blip-itm-base-coco",
    REFCAP_SENTENCE_TRANSFORMER="/caminho/local/paraphrase-distilroberta-v2",
    HF_HUB_OFFLINE="1",
    TRANSFORMERS_OFFLINE="1",
    REFCAP_CARREGAR_MODELOS="1",
    LOG_LEVEL="INFO",
    HF_HOME="/caminho/com/espaco/.cache/huggingface"

; -----------------------------------------------------------------------------
; Ciclo de vida.
;
; ★ startsecs: quanto tempo o processo precisa ficar VIVO para contar como
;   "started". NÃO é limite do tempo de carga — processo vivo carregando
;   modelos conta como rodando.
;   O que ele controla: se o processo MORRER antes de startsecs, o supervisord
;   trata como falha de start e retenta (startretries vezes); esgotadas, vai
;   para FATAL.
;
;   ⚠️ ESTA É A CAUSA MAIS COMUM DE "carregou mas não ficou permanente":
;      o modelo carrega, algo falha (OOM, modelo inexistente, permissão), o
;      processo morre, o supervisord reinicia — e o log mostra o carregamento
;      várias vezes, com PIDs DIFERENTES.
;      Assinatura: `supervisorctl status` em BACKOFF ou FATAL.
;
; stopwaitsecs alto: dá tempo de um job em andamento terminar antes do SIGKILL.
; -----------------------------------------------------------------------------
autostart=true
autorestart=true
startsecs=60
startretries=3
stopwaitsecs=120
stopsignal=TERM

; stopasgroup/killasgroup: o uvicorn pode ter processos filhos. Sem estes,
; parar o programa deixaria órfãos segurando memória de GPU.
stopasgroup=true
killasgroup=true

; -----------------------------------------------------------------------------
; Logs. É AQUI que está a resposta quando algo dá errado.
;
;     supervisorctl status refcap-api
;     supervisorctl tail -f refcap-api stderr
;     grep -E "spawned|exited|gave up" /var/log/supervisor/supervisord.log
; -----------------------------------------------------------------------------
stdout_logfile=/var/log/refcap-api/stdout.log
stderr_logfile=/var/log/refcap-api/stderr.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5

user=seu_usuario